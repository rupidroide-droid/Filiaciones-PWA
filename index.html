
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#17253c"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>Filiaciones</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f1f4f8;
      color: #17253c;
      font-family: -apple-system,
                   BlinkMacSystemFont,
                   "Segoe UI",
                   sans-serif;
      line-height: 1.5;
    }

    header {
      background: #17253c;
      color: white;
      padding: 18px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.85;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    h2 {
      font-size: 21px;
      margin-top: 8px;
    }

    h3 {
      font-size: 18px;
    }

    button {
      display: block;
      width: 100%;
      padding: 13px 15px;
      margin: 10px 0;
      border: none;
      border-radius: 9px;
      background: #244e79;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    button:active {
      opacity: 0.8;
    }

    input,
    select,
    textarea {
      max-width: 100%;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #397ab6;
      outline-offset: 1px;
    }

    details summary {
      user-select: none;
    }

    pre {
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      padding: 12px 16px 24px;
      text-align: center;
      font-size: 12px;
      color: #59677a;
    }
  </style>
</head>

<body>

  <header>
    <h1>Filiaciones</h1>
    <p>
      Beta 0.9.10 · Registro local de actuaciones
    </p>
  </header>

  <main>
    <p>Cargando aplicación...</p>
  </main>

  <footer>
    Versión de pruebas · Utilizar solo datos ficticios
  </footer>

  <script src="./almacenamiento.js"></script>

  <script src="./exportacion.js?v=0911"></script>
<script src="./app.js?v=0911"></script>
  <script src="./seguridad.js?v=071"></script>

  <script src="./copias.js?v=080"></script>

  <script src="./boton-copias.js?v=081"></script>

  <script src="./restauracion.js?v=095"></script>

  <script src="./pantalla-restauracion.js?v=094"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {
            console.warn(
              "No se pudo registrar el servicio offline:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
