
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17365d">

  <title>Filiaciones</title>

  <style>
    body {
      font-family: system-ui;
      background: #f3f5f9;
      margin: 0;
      color: #17253c;
    }

    header {
      background: #17365d;
      color: white;
      padding: 25px 18px;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    button {
      display: block;
      width: 100%;
      padding: 19px;
      margin: 12px 0;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      background: white;
      color: #087cf5;
      font-size: 17px;
      text-align: left;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    h1 {
      margin: 0;
    }

    small {
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <h1>Filiaciones</h1>
    <p>Registro local de actuaciones</p>
  </header>

  <main>
    <h2>Menú principal</h2>
    <p>Cargando aplicación...</p>
  </main>

  <!-- Almacenamiento cifrado -->
  <script src="./almacenamiento.js"></script>

  <!-- Exportación Word Beta 0.9.7 -->
  <script src="./exportacion.js?v=097"></script>

  <!-- Aplicación principal Beta 0.9.8 -->
  <script src="./app.js?v=098"></script>

  <!-- Bloqueo automático -->
  <script src="./seguridad.js?v=071"></script>

  <!-- Copias de seguridad cifradas -->
  <script src="./copias.js?v=080"></script>

  <!-- Botón de copias -->
  <script src="./boton-copias.js?v=081"></script>

  <!-- Restauración con diagnóstico -->
  <script src="./restauracion.js?v=095"></script>

  <!-- Pantalla de restauración -->
  <script src="./pantalla-restauracion.js?v=094"></script>

  <!-- Funcionamiento sin conexión -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {
            console.error(
              "Error al registrar Service Worker:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
